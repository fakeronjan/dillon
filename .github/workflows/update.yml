name: Update DILLON Ratings

on:
  schedule:
    - cron: '53 18 * * *'  # backstop, 18:53 UTC. The droplet (157.245.209.249) dispatches this at 15:53 UTC; GitHub's own cron starts hours late, see /opt/fleet-dispatch there
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cython numpy
          pip install --no-build-isolation -r requirements.txt

      - name: Run ratings engine
        run: python dillon.py

      # matchups_cache/ holds per-season Weekly Matchups (weekly_matchups.py),
      # fingerprinted by engine code + that season's games and ratings, so a
      # stale entry recomputes itself. A miss rebuilds 1971 on (~10 min).
      - name: Restore matchups cache
        uses: actions/cache/restore@v4
        with:
          path: matchups_cache
          key: dillon-matchups-${{ github.run_id }}
          restore-keys: dillon-matchups-

      - name: Generate web data
        run: python generate_data.py

      - name: Save matchups cache
        uses: actions/cache/save@v4
        with:
          path: matchups_cache
          key: dillon-matchups-${{ github.run_id }}

      - name: Commit and push updated data
        run: |
          git config user.name  "DILLON Bot"
          git config user.email "dillon-bot@users.noreply.github.com"
          git add loaded_NFL_games.csv all_NFL_games.csv dillon_react_ratings.csv weekly_standings.csv dillon_ratings_with_standings.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            # Race-safe push: if another commit landed during this run, rebase
            # the data update on top and retry. Avoids losing a day's data
            # update when a code push lands mid-cron-run.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
          fi
