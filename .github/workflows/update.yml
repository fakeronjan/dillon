name: Update DILLON Ratings

on:
  schedule:
    - cron: '19 15 * * *'   # 15:19 UTC daily = 8:19 AM PDT (in-season) / 7:19 AM PST (off-season)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cython numpy
          pip install --no-build-isolation -r requirements.txt

      - name: Run ratings engine
        run: python dillon.py

      - name: Generate web data
        run: python generate_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "DILLON Bot"
          git config user.email "dillon-bot@users.noreply.github.com"
          git add loaded_NFL_games.csv all_NFL_games.csv dillon_react_ratings.csv dillon_hottake_ratings.csv weekly_standings.csv dillon_ratings_with_standings.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            git push
          fi
